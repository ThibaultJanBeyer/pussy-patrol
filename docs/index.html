<!DOCTYPE html>

		<title>Pussy Patrol</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #f1cdf2;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #f1cdf2;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="game.icon.png" sizes="512x512">
<link rel="apple-touch-icon" href="game.apple-touch-icon.png"/>
<link rel="manifest" href="game.manifest.json">
<meta property="og:title" content="Pussy Patrol">
<meta property="og:image" content="https://pussy-patrol.com/game.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pussy-patrol.com/game.png">
			<script>
// Inlined into the exported HTML <head> by scripts/publish-pages.sh.
//
// GitHub Pages will not let us set Content-Encoding, so the 38 MB engine binary
// ships pre-compressed as game.wasm.gz and is inflated here with the browser's
// native DecompressionStream. Two more jobs while we are in the fetch path:
//
//   * start the wasm and pck downloads during HTML parse, roughly one RTT plus
//     one game.js download earlier than Godot would ask for them;
//   * keep the body a stream, so WebAssembly.instantiateStreaming can compile
//     while bytes are still arriving instead of after the last one.
//
// Note: DecompressionStream has no 'brotli' format in any shipping browser,
// only 'gzip', 'deflate' and 'deflate-raw'. Brotli on the wire needs a server
// that sends Content-Encoding: br. See README.md.
(() => {
	'use strict';

	const WASM = 'game.wasm';
	const WASM_GZ = 'game.wasm.gz';
	const PCK = 'game.pck';

	const origFetch = window.fetch.bind(window);

	const basename = (input) => {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		return url.split(/[?#]/)[0].split('/').pop();
	};

	// --- pre-warmed downloads -------------------------------------------------

	const warm = new Map();

	const preload = (url) => {
		const res = origFetch(url, { credentials: 'same-origin' });
		// Godot may never claim it (unsupported browser, boot error). Swallow the
		// rejection here so it does not surface as an unhandled one.
		res.catch(() => {});
		warm.set(url, res);
	};

	// One shot. Godot retries a failed load up to 4 times and a consumed body
	// cannot be replayed, so every attempt after the first goes to the network.
	const claim = (url) => {
		const warmed = warm.get(url);
		warm.delete(url);
		return warmed || origFetch(url, { credentials: 'same-origin' });
	};

	// --- gzip -> wasm ---------------------------------------------------------

	async function loadWasm() {
		if (typeof DecompressionStream === 'undefined') {
			throw new Error('This browser cannot decompress the game (DecompressionStream is missing).');
		}

		const res = await claim(WASM_GZ);
		if (!res.ok) {
			throw new Error(`Failed loading file '${WASM_GZ}' (HTTP ${res.status})`);
		}

		// Peek the first two bytes. A proxy that treats .gz as a transfer encoding
		// rather than a file extension hands us the raw wasm already inflated.
		const reader = res.body.getReader();
		let head = new Uint8Array(0);
		let ended = false;
		while (head.length < 2 && !ended) {
			const chunk = await reader.read();
			ended = chunk.done;
			if (chunk.value && chunk.value.length > 0) {
				const merged = new Uint8Array(head.length + chunk.value.length);
				merged.set(head);
				merged.set(chunk.value, head.length);
				head = merged;
			}
		}

		// Re-emit the peeked bytes, then the rest of the response untouched.
		const body = new ReadableStream({
			start(controller) {
				if (head.length > 0) {
					controller.enqueue(head);
				}
				if (ended) {
					controller.close();
				}
			},
			async pull(controller) {
				const chunk = await reader.read();
				if (chunk.done) {
					controller.close();
				} else {
					controller.enqueue(chunk.value);
				}
			},
			cancel(reason) {
				return reader.cancel(reason);
			},
		});

		const gzipped = head.length >= 2 && head[0] === 0x1f && head[1] === 0x8b;
		const wasm = gzipped ? body.pipeThrough(new DecompressionStream('gzip')) : body;

		// instantiateStreaming insists on this content type.
		return new Response(wasm, {
			status: 200,
			headers: { 'Content-Type': 'application/wasm' },
		});
	}

	// --- wire it up -----------------------------------------------------------

	preload(WASM_GZ);
	preload(PCK);

	window.fetch = function (input, init) {
		// Only claim Godot's own plain `fetch(file)` boot requests; anything with
		// custom options is the game talking to the network at runtime.
		if (!init) {
			const name = basename(input);
			if (name === WASM) {
				return loadWasm();
			}
			if (name === PCK) {
				return claim(PCK);
			}
		}
		return origFetch(input, init);
	};
})();
		</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="game.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="game.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game","experimentalVK":false,"fileSizes":{"game.pck":4646692,"game.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"game.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
